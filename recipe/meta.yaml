{% set name = "metakernel" %}
{% set version = "1.0.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 499a0e399e353e0fb4a74e105ea2ad2aed89a15053a299f5fa93c027d721743a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
    - poetry-core >=2.0.0
  run:
    - python
    - comm >=0.1.3
    - ipykernel >=6.22.0
    - jupyter_core >=5.3.1
    - pexpect >=4.9.0
    - jedi >=0.19.0
  run_constrained:
    - portalocker >=2.8.0
    - ipyparallel >=8.5.1

# Requires the system 'man' command, which is unavailable in the CI environment.
{% set deselect_tests = " --deselect=tests/test_replwrap.py::REPLWrapTestCase::test_bash" %}

test:
  source_files:
    - tests
  imports:
    - metakernel
    - metakernel.config
    - metakernel.process_metakernel
    - metakernel.replwrap
  commands:
    - pip check
    # Upstream test suite opens many ZMQ sockets and exceeds the default macOS file descriptor limit.
    - ulimit -n 4096 && pytest tests {{ deselect_tests }}  # [osx]
    - pytest tests {{ deselect_tests }}  # [not osx]
  requires:
    - pip
    - pytest >=9.0
    - pytest-timeout >=2.2.0
    - requests >=2.29.0
    - ipywidgets >=8.0.5


about:
  home: https://github.com/Calysto/metakernel
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Metakernel for Jupyter.
  description: |
    A Jupyter/IPython kernel template which includes core magic functions
    (including help, command and file path completion, parallel and
    distributed processing, downloads, and much more).
  dev_url: https://github.com/Calysto/metakernel
  doc_url: https://calysto.github.io/metakernel

extra:
  recipe-maintainers:
    - ocefpaf
    - ericdill
    - mariusvniekerk
    - blink1073
    - dsblank
